name: デイリーランキングスクレイプ

on:
  schedule:
    # 日本時間 朝7:00 (UTC 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリの取得
        uses: actions/checkout@v3

      - name: Pythonのセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 環境構築 (日本語フォント入り)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-ipafont fonts-ipaexfont fonts-noto-cjk
          pip install pandas playwright
          playwright install chromium

      - name: スクリプト実行
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" python main.py

      - name: 結果を保存
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "🤖 Auto update (LP & Review)" || echo "No changes to commit"
          git push