name: デイリーランキングスクレイプ

on:
  schedule:
    # 毎日 朝7:00 (JST) = 前日 22:00 (UTC)
    - cron: '0 22 * * *'
  workflow_dispatch: # 手動実行用

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリの取得
        uses: actions/checkout@v3

      - name: Pythonのセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 必要なライブラリと日本語フォントのインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          # ★ここが追加ポイント: 日本語フォントを入れる魔法
          sudo apt-get install -y fonts-ipafont fonts-ipaexfont fonts-noto-cjk
          pip install pandas playwright
          playwright install chromium

      - name: ランキングスクレイピング実行
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" python main.py

      - name: 結果を保存して更新
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "🤖 Auto update ranking with fonts" || echo "No changes to commit"
          git push