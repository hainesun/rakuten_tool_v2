name: Daily Ranking Scrape

on:
  schedule:
    # 日本時間の朝5:00 (UTC 20:00) に実行
    - cron: '0 20 * * *'
  workflow_dispatch: # 手動実行ボタン

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリの取得
        uses: actions/checkout@v3

      - name: Pythonのセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: 必要なライブラリと仮想モニターのインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: スクレイピング実行 (仮想モニターで画面ありを偽装)
        # ★ここが魔法のコマンドです！(xvfb-run)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" python main.py

      - name: 結果を保存して更新
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Auto update daily report" || exit 0
          git push