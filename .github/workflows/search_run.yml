name: SEO検索順位スクレイプ

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-ipafont fonts-ipaexfont fonts-noto-cjk
          pip install pandas playwright
          playwright install chromium
      - run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" python search_main.py
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "🤖 Auto update (SEO Search)" || echo "No changes to commit"
          git push